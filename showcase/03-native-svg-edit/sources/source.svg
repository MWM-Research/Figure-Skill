<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#222222"/></marker></defs>
  <rect width="700" height="300" fill="white"/>
  <g id="node-input" data-role="node" data-node-id="input"><rect id="node-input-shape" data-role="node-shape" x="40" y="100" width="140" height="70" rx="12" fill="#f2f2f2" stroke="#222"/><text id="node-input-label" data-role="node-label" x="110" y="141" text-anchor="middle">Input</text></g>
  <g id="node-encoder" data-role="node" data-node-id="encoder"><rect id="node-encoder-shape" data-role="node-shape" x="280" y="100" width="140" height="70" rx="12" fill="#dbeafe" stroke="#222"/><text id="node-encoder-label" data-role="node-label" x="350" y="141" text-anchor="middle">Encoder</text></g>
  <g id="node-output" data-role="node" data-node-id="output"><rect id="node-output-shape" data-role="node-shape" x="520" y="100" width="140" height="70" rx="12" fill="#f2f2f2" stroke="#222"/><text id="node-output-label" data-role="node-label" x="590" y="141" text-anchor="middle">Output</text></g>
  <line id="edge-1" data-role="edge" data-from="input" data-to="encoder" x1="180" y1="135" x2="280" y2="135" stroke="#222" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line id="edge-2" data-role="edge" data-from="encoder" data-to="output" x1="420" y1="135" x2="520" y2="135" stroke="#222" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>
