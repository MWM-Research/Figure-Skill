<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 780 300">
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#222222" /></marker></defs>
  <rect width="700" height="300" fill="white" />
  <g id="node-input" data-role="node" data-node-id="input"><rect id="node-input-shape" data-role="node-shape" x="40" y="40" width="140" height="70" rx="12" fill="#f2f2f2" stroke="#222" /><text id="node-input-label" data-role="node-label" x="110" y="81" text-anchor="middle">Input</text></g>
  <g id="node-encoder" data-role="node" data-node-id="encoder"><rect id="node-encoder-shape" data-role="node-shape" x="260" y="40" width="160" height="78" rx="12" fill="#dbeafe" stroke="#222" /><text id="node-encoder-label" data-role="node-label" x="340" y="85" text-anchor="middle">Encoder</text></g>
  <g id="node-output" data-role="node" data-node-id="output"><rect id="node-output-shape" data-role="node-shape" x="640" y="40" width="140" height="70" rx="12" fill="#f2f2f2" stroke="#222" /><text id="node-output-label" data-role="node-label" x="710" y="81" text-anchor="middle">Output</text></g>
  <line id="edge-1" data-role="edge" data-from="input" data-to="encoder" x1="180" y1="75" x2="260" y2="79" stroke="#222" stroke-width="2" marker-end="url(#arrowhead)" />
  <line id="edge-2" data-role="edge" data-from="encoder" data-to="attention" x1="420" y1="79" x2="460" y2="75" stroke="#222" stroke-width="2" marker-end="url(#arrowhead)" />
<g id="node-attention" data-role="node" data-node-id="attention"><rect id="node-attention-shape" data-role="node-shape" rx="12" fill="#f2f2f2" stroke="#222222" stroke-width="2" x="460" y="40" width="150" height="70" /><text id="node-attention-label" data-role="node-label" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111" x="535" y="81">Attention</text></g><line id="edge-3" data-role="edge" data-from="attention" data-to="output" data-meaning="data-flow" stroke="#222222" stroke-width="2" marker-end="url(#arrowhead)" x1="610" y1="75" x2="640" y2="75" /></svg>