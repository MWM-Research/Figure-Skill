name: test

on:
  push:
  pull_request:

jobs:
  workflow-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r figure-skill/requirements.txt
      - name: Compile scripts
        shell: pwsh
        run: python -m py_compile (Get-ChildItem figure-skill/scripts -Recurse -Filter *.py | ForEach-Object FullName)
      - name: Run tests
        run: python -m unittest discover -s figure-skill/tests -v
